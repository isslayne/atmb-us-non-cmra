name: Verify upstream address queries
on: workflow_dispatch
permissions:
  contents: read
jobs:
  usps:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: dev
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chrome
      - name: Verify consecutive USPS queries through normal browser form
        run: npm run test:usps-live
        env:
          USPS_HEADLESS: 'false'
          USPS_CHANNEL: chrome
