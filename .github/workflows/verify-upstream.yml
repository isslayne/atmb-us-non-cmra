name: Verify upstream address queries
on: workflow_dispatch
permissions:
  contents: read
jobs:
  usps:
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      USPS_HEADLESS: 'false'
      USPS_CHANNEL: chrome
    steps:
      - uses: actions/checkout@v7
        with:
          ref: dev
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chrome
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Verify consecutive USPS queries through normal browser form
        run: npm run test:usps-live
      - name: Verify production Rust browser bridge on the same runner
        if: always()
        shell: bash
        run: cargo test --locked live_browser_bridge -- --ignored --nocapture
