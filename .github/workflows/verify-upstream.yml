name: Verify upstream address queries
on: workflow_dispatch
permissions:
  contents: read
jobs:
  usps:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: dev
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chrome
      - name: Verify USPS sample through normal browser form
        shell: bash
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            xvfb-run --auto-servernum npm run test:usps-live
          else
            npm run test:usps-live
          fi
        env:
          USPS_HEADLESS: 'false'
          USPS_CHANNEL: chrome
