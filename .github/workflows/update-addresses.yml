name: Update US addresses
run-name: Update addresses (${{ inputs.address_scope || 'tax-free' }}) from dev
on:
  schedule:
    # Monday 02:17 UTC / 10:17 Asia/Shanghai and Asia/Singapore.
    - cron: '17 2 * * 1'
  workflow_dispatch:
    inputs:
      address_scope:
        description: 'Address scope (tax-free = AK, DE, MT, NH, OR)'
        type: choice
        options: [tax-free, all]
        default: tax-free
      usps_enabled:
        description: 'Check addresses with USPS'
        type: boolean
        default: true
      usps_interval_ms:
        description: 'Delay between USPS requests in milliseconds (0-60000)'
        type: string
        default: '1000'
      max_addresses:
        description: 'Smoke-test limit; 0 = all selected addresses. Limited runs do not commit results.'
        type: string
        default: '0'
      resume_run_id:
        description: 'Optional previous dev run ID: reuse its complete Smarty CSV when ATMB is unavailable'
        type: string
        default: ''
      credentials_secret:
        description: 'Optional repository Secret NAME containing ID=TOKEN,ID2=TOKEN2 (takes precedence)'
        type: string
        default: 'CREDENTIALS'
      smarty_auth_id_secret:
        description: 'Repository Secret NAME for Smarty auth ID (do not enter credentials here)'
        type: string
        default: 'SMARTY_AUTH_ID'
      smarty_auth_token_secret:
        description: 'Repository Secret NAME for Smarty auth token (do not enter credentials here)'
        type: string
        default: 'SMARTY_AUTH_TOKEN'

permissions:
  contents: read
  actions: read
concurrency:
  group: update-us-addresses-dev
  cancel-in-progress: false

env:
  ADDRESS_SCOPE: ${{ inputs.address_scope || 'tax-free' }}
  MAX_ADDRESSES: ${{ inputs.max_addresses || '0' }}
  SOURCE_RUN_ID: ${{ inputs.resume_run_id }}
  RESULT_DIR: result/${{ inputs.max_addresses != '' && inputs.max_addresses != '0' && 'smoke/' || '' }}${{ inputs.address_scope || 'tax-free' }}

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7
        with:
          ref: dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - run: cargo test --locked
        if: inputs.resume_run_id == ''
      - run: cargo build --release --locked
        if: inputs.resume_run_id == ''
      - name: Resume previously checked addresses
        if: inputs.resume_run_id != ''
        env:
          GH_TOKEN: ${{ github.token }}
          RESUME_RUN_ID: ${{ inputs.resume_run_id }}
        run: |
          [[ "$RESUME_RUN_ID" =~ ^[0-9]+$ ]] || exit 1
          [[ "$(gh run view "$RESUME_RUN_ID" --json headBranch --jq .headBranch)" == dev ]] || exit 1
          rm -rf -- "$RESULT_DIR"
          gh run download "$RESUME_RUN_ID" --name "smarty-$RESUME_RUN_ID" --dir "$RESULT_DIR" ||
            gh run download "$RESUME_RUN_ID" --name "addresses-$ADDRESS_SCOPE-$RESUME_RUN_ID" --dir "$RESULT_DIR"
          python3 - <<'PYTHON'
          import os, pathlib
          summary = (pathlib.Path(os.environ['RESULT_DIR']) / 'summary.md').read_text()
          if not summary.startswith('# Address check: ' + os.environ['ADDRESS_SCOPE'] + '\n'):
              raise SystemExit('Source scope does not match')
          if '- Limited smoke test: false' not in summary:
              raise SystemExit('Cannot resume a limited sample as a complete dataset')
          if '- Smarty errors: 0' not in summary:
              raise SystemExit('Source Smarty validation is incomplete')
          PYTHON
      - name: Fetch ATMB and validate with Smarty
        if: inputs.resume_run_id == ''
        env:
          ATMB_HTTP_BACKEND: curl
          USPS_ENABLED: 'false'
          CREDENTIALS: ${{ secrets[inputs.credentials_secret || 'CREDENTIALS'] }}
          SMARTY_AUTH_ID: ${{ secrets[inputs.smarty_auth_id_secret || 'SMARTY_AUTH_ID'] }}
          SMARTY_AUTH_TOKEN: ${{ secrets[inputs.smarty_auth_token_secret || 'SMARTY_AUTH_TOKEN'] }}
        run: |
          rm -rf -- "$RESULT_DIR"
          ./target/release/atmb-us-physical
      - name: Save Smarty results for USPS job
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: smarty-${{ github.run_id }}
          path: ${{ env.RESULT_DIR }}/
          if-no-files-found: ignore
          retention-days: 30
          overwrite: true

  usps:
    needs: fetch
    if: github.event_name != 'workflow_dispatch' || inputs.usps_enabled
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7
        with:
          ref: dev
      - uses: actions/download-artifact@v8
        with:
          name: smarty-${{ github.run_id }}
          path: input
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - name: Install USPS browser
        run: |
          npm ci
          npx playwright install --with-deps chrome
      - run: cargo build --release --locked
      - name: Query USPS for the same addresses without repeating Smarty calls
        env:
          USPS_INPUT_CSV: input/checks.csv
          USPS_ENABLED: 'true'
          USPS_BACKEND: browser
          USPS_CHANNEL: chrome
          USPS_HEADLESS: 'false'
          USPS_INTERVAL_MS: ${{ inputs.usps_interval_ms || '1000' }}
        run: |
          rm -rf -- "$RESULT_DIR"
          ./target/release/atmb-us-physical.exe
      - name: Save complete results or partial diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: addresses-${{ inputs.address_scope || 'tax-free' }}-${{ github.run_id }}
          path: ${{ env.RESULT_DIR }}/
          if-no-files-found: ignore
          retention-days: 30
          overwrite: true

  publish:
    permissions:
      contents: write
    needs: [fetch, usps]
    if: >-
      always() && needs.fetch.result == 'success' &&
      (needs.usps.result == 'success' ||
       (github.event_name == 'workflow_dispatch' && !inputs.usps_enabled)) &&
      (inputs.max_addresses == '' || inputs.max_addresses == '0')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: dev
      - name: Remove previous results
        run: rm -rf -- "$RESULT_DIR"
      - uses: actions/download-artifact@v8
        with:
          name: ${{ needs.usps.result == 'success' && format('addresses-{0}-{1}', env.ADDRESS_SCOPE, github.run_id) || format('smarty-{0}', github.run_id) }}
          path: ${{ env.RESULT_DIR }}
      - name: Commit complete results to dev
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- "$RESULT_DIR"
          if git diff --cached --quiet; then
            echo 'Address results are unchanged.'
            exit 0
          fi
          git commit -m "data: update $ADDRESS_SCOPE US addresses"
          git pull --rebase origin dev
          git push origin HEAD:dev
